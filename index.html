<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaravelMC - Minecraft Bedrock Server</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF2D20;
            --dark-bg: #131313;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --text-secondary: #b3b3b3;
            --wa-color: #25D366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Hero Section */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(rgba(19, 19, 19, 0.85), rgba(19, 19, 19, 0.98)), 
                        url('https://images.unsplash.com/photo-1605899435973-ca2d1a8861cf?q=80&w=1920') no-repeat center center/cover;
        }

        .logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0px 0px 20px rgba(255, 45, 32, 0.5));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 5px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .version-badge {
            background-color: var(--primary);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 25px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(255, 45, 32, 0.3);
        }

        /* Server Info Box (Perbaikan Bungkus Teks) */
        .server-info {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255, 45, 32, 0.15);
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            flex-direction: column; /* Biar vertikal kalau di HP, gak dempet kesamping */
            align-items: flex-start;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2d2d2d;
            text-align: left;
        }

        @media (min-width: 400px) {
            .info-row {
                flex-direction: row; /* Kalau layar agak lebar, balik kesamping lagi secara rapi */
                justify-content: space-between;
                align-items: center;
            }
        }

        .info-label {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-value {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 1.05rem;
            color: #fff;
            font-weight: bold;
            word-break: break-all; /* Mencegah teks meluber keluar box */
        }

        /* Buttons style */
        .btn {
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.2s ease;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-top: 10px;
        }

        .btn-copy {
            background: var(--primary);
        }

        .btn-copy:hover {
            background: #e0261b;
        }

        .btn-wa {
            background: var(--wa-color);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2);
        }

        .btn-wa:hover {
            background: #1ebd58;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            background-color: #0b0b0b;
            border-top: 1px solid #1a1a1a;
        }
    </style>
</head>
<body>

    <section class="hero">
        <img src="https://i.ibb.co.com/HD10HD6J/logo1.png" alt="LaravelMC Logo" class="logo">
        
        <h1>Laravel<span>MC</span></h1>
        <div class="version-badge">Minecraft Bedrock v26.2.0</div>

        <div class="server-info">
            <div class="info-row">
                <span class="info-label"><i class="fa-solid fa-server" style="color: var(--primary)"></i> IP Address</span>
                <span class="info-value" id="ip-text">ohio-microsoft.gl.at.ply.gg</span>
            </div>
            <div class="info-row">
                <span class="info-label"><i class="fa-solid fa-plug" style="color: var(--primary)"></i> Port</span>
                <span class="info-value" id="port-text">58457</span>
            </div>
            
            <button class="btn btn-copy" onclick="copyServerDetails()">
                <i class="fa-regular fa-copy"></i> Salin IP & Port
            </button>
            
            <a href="https://chat.whatsapp.com/GGQMMB7I763BWPdAKpGIzp" target="_blank" class="btn btn-wa">
                <i class="fa-brands fa-whatsapp"></i> Gabung Komunitas WA
            </a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 LaravelMC. All rights reserved.</p>
    </footer>

    <script>
        function copyServerDetails() {
            const ip = document.getElementById('ip-text').innerText;
            const port = document.getElementById('port-text').innerText;
            const textToCopy = `${ip}:${port}`;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Berhasil Disalin!';
                btn.style.background = '#2ecc71';
                
                setTimeout(() => {
                    btn.innerHTML = '<i class="fa-regular fa-copy"></i> Salin IP & Port';
                    btn.style.background = '#FF2D20';
                }, 2000);
            }).catch(err => {
                alert('Gagal menyalin teks: ', err);
            });
        }
    </script>
</body>
</html>
